name: Generate a new podcast episode

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Article URL"
        required: true
      provider:
        description: "Text-to-speech provider"
        required: false
        default: voxtral
        type: choice
        options: [voxtral, elevenlabs]

permissions:
  contents: write

concurrency:
  group: podcast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Fetch, narrate and publish an episode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      URL: ${{ inputs.url }}
      TTS_PROVIDER: ${{ inputs.provider }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      VOXTRAL_API_KEY: ${{ secrets.VOXTRAL_API_KEY }}
      VOXTRAL_VOICE_ID: ${{ secrets.VOXTRAL_VOICE_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go 1.25
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Verify provider keys
        id: verify
        run: |
          if go run . verify-keys; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::key verification failed; skipping generation"
          fi

      - name: Fetch article source
        id: fetch
        if: steps.verify.outputs.ok == 'true'
        run: |
          mkdir -p out
          if go run . fetch "$URL" out; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::article unavailable or too short; skipping generation"
          fi

      - name: Assign episode number and slug
        id: episode
        if: steps.verify.outputs.ok == 'true' && steps.fetch.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=${URL%/}; last=${last##*/}; last=${last%%[?]*}
          # Lowercase, replace non-alphanumerics with single hyphens, trim ends.
          slug=$(printf '%s' "$last" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed -E 's/-+/-/g; s/^-|-$//g')
          [ -n "$slug" ] || slug="episode"
          tags=$(gh release list --limit 200 --json tagName --jq '.[].tagName')
          existing=$(printf '%s\n' "$tags" | grep -E "^ep-[0-9]+-$slug$" | head -n1 || true)
          if [ -n "$existing" ]; then
            number=$(printf '%s' "$existing" | sed -E 's/^ep-([0-9]+)-.*/\1/')
          else
            number=$(( $(printf '%s\n' "$tags" | grep -c . || true) + 1 ))
          fi
          # Title-case the slug words for the release title.
          title=$(printf '%s' "$slug" | tr '-' ' ' | awk '{for(i=1;i<=NF;i++)$i=toupper(substr($i,1,1)) substr($i,2)}1')
          {
            echo "base=ep-$number-$slug"
            echo "title=Episode $number - $title"
          } >> "$GITHUB_OUTPUT"

      - name: Write transcript with Claude
        if: steps.verify.outputs.ok == 'true' && steps.fetch.outputs.ok == 'true'
        run: go run . transcript "$URL" out

      - name: Synthesize audio
        if: steps.verify.outputs.ok == 'true' && steps.fetch.outputs.ok == 'true'
        run: go run . speak out

      - name: Rename episode files
        if: steps.verify.outputs.ok == 'true' && steps.fetch.outputs.ok == 'true'
        env:
          BASE: ${{ steps.episode.outputs.base }}
        run: |
          mv out/episode.mp3 "out/$BASE.mp3"
          mv out/source.md "out/$BASE-source.md"
          mv out/transcript.txt "out/$BASE-transcript.txt"

      - name: Publish GitHub release
        if: steps.verify.outputs.ok == 'true' && steps.fetch.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.episode.outputs.base }}
          TITLE: ${{ steps.episode.outputs.title }}
        run: |
          gh release delete "$BASE" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$BASE" \
            "out/$BASE.mp3" "out/$BASE-source.md" "out/$BASE-transcript.txt" \
            --title "$TITLE" --notes "Source: $URL"
          link=$(gh release view "$BASE" --json assets --jq '.assets[0].url')
          echo "### 🎧 [$TITLE]($link)" >> "$GITHUB_STEP_SUMMARY"
