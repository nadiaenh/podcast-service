name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-west-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: pulumi/actions@v7

      - run: ./lambda/build.sh

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/podcast-service-gha-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: pulumi login
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::${account_id}"
          pulumi login "s3://podcast-service-pulumi-state-${account_id}?region=${{ env.AWS_REGION }}"
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      - name: pulumi up
        run: |
          pulumi stack select dev
          pulumi up --yes
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      - name: tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "deploy-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" --title "Deploy ${GITHUB_SHA::7}" --notes "Automated deploy of ${GITHUB_SHA}" --target "${GITHUB_SHA}"
