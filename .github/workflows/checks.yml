name: Run checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false
      - name: Vet the code
        run: go vet ./...
      - name: Run the tests
        run: go test ./...
      - name: Build the binary
        run: go build -o /dev/null .
