name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Vet, test and build the binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go 1.25
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Vet the code
        run: go vet ./...
      - name: Run the tests
        run: go test ./...
      - name: Build the binary
        run: go build -o /dev/null .
