name: Run checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Vet, test and build binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go 1.25
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Vet code
        run: go vet ./...
      - name: Run tests
        run: go test ./...
      - name: Build Go binary
        run: go build -o /dev/null .
